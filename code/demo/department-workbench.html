<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Company OS · 部门工作台详细原型</title>
<style>
:root{--bg:#f2f4f1;--paper:#fffefa;--ink:#18231d;--muted:#68736c;--line:#dfe5df;--green:#174c3c;--green2:#2a7659;--lime:#dff36b;--blue:#397896;--orange:#e48835;--red:#c94c43;--shadow:0 14px 34px rgba(28,48,38,.075)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}button,input,textarea{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{position:sticky;top:0;height:100vh;background:var(--green);color:white;padding:22px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 7px 24px}.logo{width:39px;height:39px;border-radius:11px;background:var(--lime);color:var(--green);display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{color:#ffffff8c}.group-title{font-size:9px;color:#ffffff68;letter-spacing:1.3px;padding:12px 10px 5px}.nav{border:0;background:transparent;color:#ffffffb5;text-align:left;padding:10px 11px;border-radius:8px;cursor:pointer;width:100%;margin:2px 0}.nav:hover,.nav.active{background:#ffffff17;color:#fff}.nav.active{box-shadow:inset 3px 0 var(--lime)}.side-foot{margin-top:auto;border:1px solid #ffffff1e;border-radius:10px;padding:11px;font-size:10px;color:#ffffff8f;line-height:1.6}.side-foot b{color:#fff}.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:6px}main{min-width:0;padding:26px 30px 46px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.top h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:11px;line-height:1.6;margin-top:5px}.badge{display:inline-flex;padding:6px 9px;border-radius:99px;background:#e4eee8;color:var(--green2);font-size:10px}.card{background:var(--paper);border:1px solid #19322410;border-radius:13px;box-shadow:var(--shadow)}.hero{padding:20px;display:grid;grid-template-columns:52px 1fr;gap:14px}.hero-icon{width:52px;height:52px;border-radius:13px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-weight:800}.hero h2{font-size:17px;margin:0 0 4px}.request{display:flex;gap:8px;margin-top:11px}.request textarea{flex:1;border:1px solid var(--line);border-radius:9px;padding:11px;min-height:47px;resize:vertical;outline:none}.request textarea:focus{border-color:var(--green2)}.btn{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:8px;cursor:pointer}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.warn{background:var(--orange);color:white;border-color:var(--orange)}.section-head{display:flex;justify-content:space-between;align-items:end;margin:21px 0 10px}.section-head h2{font-size:15px;margin:0}.section-head span{font-size:10px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:14px}.metric small{color:var(--muted);font-size:10px}.metric b{display:block;font-size:21px;margin:6px 0 3px}.metric em{font-style:normal;font-size:9px;color:var(--green2)}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.flow-card{padding:13px;cursor:pointer;position:relative;transition:.2s}.flow-card:hover{transform:translateY(-2px)}.flow-card:after{content:'→';position:absolute;right:-9px;top:42%;color:#aab3ad}.flow-card:last-child:after{display:none}.flow-head{display:flex;justify-content:space-between;align-items:center}.flow-icon{width:33px;height:33px;border-radius:9px;background:#e5eee8;color:var(--green);display:grid;place-items:center;font-weight:800}.state{font-size:9px;padding:4px 6px;border-radius:20px;background:#eef1ef;color:var(--muted)}.flow-card h3{font-size:12px;margin:9px 0 4px}.flow-card p{font-size:9px;line-height:1.5;color:var(--muted);margin:0}.flow-card.done .state{background:#e2f0e8;color:var(--green2)}.flow-card.wait .state{background:#fff0dc;color:#a75d1c}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.7fr);gap:13px}.panel{padding:17px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.step{padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}.step b{display:block;font-size:10px;margin-bottom:5px}.step p{font-size:9px;color:var(--muted);line-height:1.55;margin:0}.step-num{width:20px;height:20px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-size:9px;margin-bottom:7px}.table-wrap{overflow:auto}table{width:100%;min-width:740px;border-collapse:collapse;font-size:10px}th{padding:9px 8px;text-align:left;color:var(--muted);font-weight:500;background:#f2f5f2;white-space:nowrap}td{padding:9px 8px;border-bottom:1px solid #edf0ed;white-space:nowrap}.right{text-align:right}.short{color:var(--red);font-weight:700}.good{color:var(--green2)}tr.alert{background:#fff7eb}.formula{background:#eef4f0;border-left:3px solid var(--green2);padding:10px 12px;border-radius:7px;font-size:10px;color:#415048;line-height:1.7;margin:11px 0}.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.info{background:#f3f6f3;border-radius:9px;padding:10px}.info small{display:block;color:var(--muted);font-size:9px}.info b{display:block;font-size:13px;margin-top:4px}.handoff{display:grid;gap:8px}.handoff-item{display:grid;grid-template-columns:26px 1fr;gap:8px}.mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#e4eee8;color:var(--green);font-size:9px;font-weight:800}.handoff-item p{font-size:9px;color:var(--muted);line-height:1.55;margin:3px 0 0}.handoff-item b{font-size:10px}.permissions{display:grid;gap:7px}.perm{padding:9px;border:1px solid var(--line);border-radius:8px}.perm-head{display:flex;justify-content:space-between;font-size:10px}.perm p{font-size:9px;color:var(--muted);margin:5px 0 0}.read{color:var(--blue)}.write{color:var(--green2)}.approval{color:var(--orange)}.deny{color:var(--red)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:white;padding:6px 9px;border-radius:7px;font-size:10px;cursor:pointer}.tabs button.active{background:var(--green);color:white;border-color:var(--green)}.source{font-size:9px;color:var(--muted);line-height:1.65}.source a{color:var(--blue)}.statusline{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:5px 7px;border-radius:20px;background:#eef1ef;color:var(--muted);font-size:9px}.chip.red{background:#fbe7e4;color:var(--red)}.chip.orange{background:#fff0dc;color:#9c581d}.money{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:10px}.money.total{font-size:14px;font-weight:800;border-top:2px solid var(--green);border-bottom:0}.toast{position:fixed;right:22px;bottom:22px;background:#16231d;color:white;padding:11px 14px;border-radius:9px;font-size:10px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:repeat(3,1fr)}.flow-card:after{display:none}.layout{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.side .group-title,.side-foot{display:none}.side nav{display:grid;grid-template-columns:repeat(3,1fr)}.nav{text-align:center;font-size:10px;padding:8px 2px}main{padding:18px 11px 30px}.top{align-items:flex-start}.badge{display:none}.hero{grid-template-columns:1fr}.request{display:grid}.flow,.metrics{grid-template-columns:1fr 1fr}.steps,.info-grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><div class="logo">AC</div><div><b>AI Company OS</b><small>部门工作台详细原型</small></div></div><nav><div class="group-title">公司协作</div><button class="nav active" data-page="overview">▦　总览与任务链</button><button class="nav" data-page="assistant">◎　CEO 总助</button><div class="group-title">业务部门</div><button class="nav" data-page="production">产　生产 Agent</button><button class="nav" data-page="warehouse">仓　仓储 Agent</button><button class="nav" data-page="purchase">采　采购 Agent</button><button class="nav" data-page="finance">财　财务 Agent</button><div class="group-title">追溯与治理</div><button class="nav" data-page="logs">⌁　协作日志</button></nav><div class="side-foot"><b><span class="live"></span>本地演示环境</b>采用用户截图中的飞书表名<br>业务数量和价格为合成数据</div></aside><main id="app"></main></div><div class="toast" id="toast"></div>
<script>
const materials=[
['VFD-075','通用变频器 7.5kW','台',1,0,100,72,8,20,64,36,2450,'华东驱动技术','5天'],['MCCB-032','电机保护断路器 32A','只',1,0,100,150,22,0,128,0,185,'常州电控','现货'],['KM-018','交流接触器 18A','只',1,0,100,105,19,50,86,14,128,'常州电控','3天'],['PSU-024','开关电源 24V 5A','只',1,0,100,100,6,0,94,6,110,'苏州工控','3天'],['FAN-120','控制柜散热风扇','只',2,0,200,244,34,0,210,0,38,'苏州工控','现货'],['ESTOP-22','急停按钮 22mm','只',1,0,100,120,15,0,105,0,42,'常州电控','现货'],['TB-2.5','接线端子 2.5mm²','片',20,2,2040,2100,450,500,1650,390,2.8,'无锡电气','2天'],['CAB-6040','控制箱体 600×400×250','台',1,0,100,60,8,30,52,48,760,'江南钣金','7天'],['WIRE-6','铜芯线 6mm²','米',5,3,515,500,120,0,380,135,8.6,'无锡电气','2天']];
const pages=['overview','assistant','production','warehouse','purchase','finance','logs'];let taskRun=false;const $=s=>document.querySelector(s);const money=n=>'¥'+n.toLocaleString('zh-CN',{maximumFractionDigits:2});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function header(title,sub){return `<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><span class="badge">产品 0001 · TCI-4T3.7GB-L</span></div>`}
function section(t,s=''){return `<div class="section-head"><h2>${t}</h2><span>${s}</span></div>`}
function steps(arr){return `<div class="steps">${arr.map((x,i)=>`<div class="step"><div class="step-num">${i+1}</div><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div>`}
function perms(arr){return `<div class="permissions">${arr.map(x=>`<div class="perm"><div class="perm-head"><b>${x[0]}</b><span class="${x[2]}">${x[1]}</span></div><p>${x[3]}</p></div>`).join('')}</div>`}
function flow(){const a=[['assistant','总','CEO 总助','拆任务、协调和汇总'],['production','产','生产 Agent','展开 BOM 和工单'],['warehouse','仓','仓储 Agent','库存分配与缺口'],['purchase','采','采购 Agent','询价比价和交期'],['finance','财','财务 Agent','成本预算与审批']];return `<div class="flow">${a.map((x,i)=>`<article class="card flow-card ${taskRun?(i<5?'done':'') :''}" data-go="${x[0]}"><div class="flow-head"><div class="flow-icon">${x[1]}</div><span class="state">${taskRun?(i===4?'待审批':'已交接'):'等待'}</span></div><h3>${x[2]}</h3><p>${x[3]}</p></article>`).join('')}</div>`}
function overview(){return header('总览与任务链','从一句 CEO 指令进入，查看每个部门究竟如何处理和交接')+`<section class="card hero"><div class="hero-icon">总助</div><div><h2>向公司下达任务</h2><div class="sub">需求将关联现有飞书产品资料：编码 0001，型号 TCI-4T3.7GB-L。</div><div class="request"><textarea id="req">我要为产品 0001（TCI-4T3.7GB-L）准备 100 套配件。请生产列清单，仓储核库存，采购处理缺口，财务汇总总成本。</textarea><button class="btn primary" id="runTask">${taskRun?'重新演示':'执行任务'}</button></div></div></section>${section('跨部门协作链','点击任何部门进入内部工作台')}${flow()}${section('现有飞书资料映射','来自用户提供的截图')}<div class="metrics"><div class="card metric"><small>生产完成汇总表</small><b>9 套</b><em>640 合格 - 631 已发货</em></div><div class="card metric"><small>生产工单</small><b>${taskRun?'新建草稿':'等待'}</b><em>目标：100 套配件</em></div><div class="card metric"><small>仓储缺口</small><b>${taskRun?'6 类':'—'}</b><em>按可用库存计算</em></div><div class="card metric"><small>财务总算</small><b>${taskRun?'¥396,146':'—'}</b><em>等待 CEO 审批</em></div></div>${section('整体细化步骤','每一步都保留输入、计算和输出')}<div class="card panel">${steps([['总助解析需求','识别产品编码、型号、数量和需要参与的部门。'],['生产生成清单','读取产品物料基础资料及 BOM 版本，乘以 100 套并计入损耗。'],['仓储计算可用量','现有量减已预留量，再与本次毛需求对比生成缺口。'],['采购核实缺料','对缺口询价，比单价、交期、MOQ、质量和付款条件。'],['财务汇总成本','库存耗用成本 + 缺料采购 + 物流 + 风险准备金。'],['CEO 审批执行','批准后才生成采购任务和飞书写入请求。']])}</div>`}
function assistant(){return header('CEO 总助 Agent','协调者只创建任务和汇总结果，不直接修改生产、库存或财务原始记录')+`<div class="layout"><div><div class="card panel">${section('总助如何拆解这条需求','父任务 AC-20261110-001')}${steps([['识别对象','产品 0001 / TCI-4T3.7GB-L，数量 100 套。'],['确认目标','备齐全部配件、补齐缺口并给出总成本。'],['创建子任务','生产 BOM、仓储核验、采购询价、财务预算。'],['设置依赖','仓储等待生产；采购等待仓储；财务等待采购。']])}${section('任务树')}<div class="handoff"><div class="handoff-item"><div class="mark">0</div><div><b>父任务：准备 100 套配件</b><p>状态：${taskRun?'等待 CEO 审批':'尚未执行'}</p></div></div><div class="handoff-item"><div class="mark">1</div><div><b>生产：生成需求清单</b><p>输出 BOM-0001-V3.2，9 类物料。</p></div></div><div class="handoff-item"><div class="mark">2</div><div><b>仓储：核库存并预留</b><p>输出 6 类缺口及库位、批次和在途信息。</p></div></div><div class="handoff-item"><div class="mark">3</div><div><b>采购：询价与交期方案</b><p>输出采购预算 ¥129,385，最长预计 7 天。</p></div></div><div class="handoff-item"><div class="mark">4</div><div><b>财务：总成本与预算意见</b><p>输出预计总成本 ¥396,146。</p></div></div></div></div></div><aside class="card panel">${section('权限边界')}${perms([['所有业务汇总','只读','read','可查看生产、仓储、采购、财务摘要和来源。'],['任务与审批记录','可写','write','创建父子任务、更新协作状态、生成管理简报。'],['业务原始数据','禁止直接写','deny','不得修改库存数量、工单完成量、采购价或财务流水。']])}${section('异常升级规则')}<div class="statusline"><span class="chip red">交期超过目标</span><span class="chip orange">预算超限</span><span class="chip orange">库存数据过期</span><span class="chip red">多部门数字冲突</span></div></aside></div>`}
function production(){const rows=materials.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td class="right">${x[3]} ${x[2]}</td><td class="right">${x[4]}%</td><td class="right"><b>${x[5]} ${x[2]}</b></td><td>备料</td></tr>`).join('');return header('生产 Agent 工作台','展示生产部门如何从产品资料生成 100 套配件清单')+`<div class="layout"><div><div class="card panel"><div class="info-grid"><div class="info"><small>产品编码</small><b>0001</b></div><div class="info"><small>产品型号</small><b>TCI-4T3.7GB-L</b></div><div class="info"><small>BOM 版本</small><b>V3.2 · 演示</b></div></div>${section('清单制作方法')}${steps([['读取产品资料','从“产品物料基础资料”匹配编码 0001 和有效 BOM 版本。'],['展开物料行','读取每套用量、单位、损耗率及使用工序。'],['计算毛需求','毛需求 = 单套用量 × 100 ×（1 + 损耗率）。'],['生成领料需求','输出物料编码、需求量和目标日期给仓储 Agent。']])}<div class="formula">示例：接线端子毛需求 = 20 片/套 × 100 套 ×（1 + 2% 损耗）= <b>2,040 片</b>；铜芯线毛需求 = 5 米/套 × 100 ×（1 + 3%）= <b>515 米</b>。</div>${section('BOM-0001-V3.2 · 100 套需求清单','合成演示数据')}<div class="table-wrap"><table><thead><tr><th>物料编码</th><th>物料名称</th><th class="right">单套用量</th><th class="right">损耗率</th><th class="right">毛需求</th><th>用途</th></tr></thead><tbody>${rows}</tbody></table></div></div></div><aside><div class="card panel">${section('读取和写入哪些飞书表')}${perms([['产品物料基础资料','只读','read','读取产品编码、型号、BOM 物料和单位。'],['生产工单','草稿可写','write','创建 100 套配件准备工单，正式下达需审批。'],['领料记录','只发起申请','approval','生产提出领料需求，由仓储确认实际发料。'],['生产记录','执行后写入','write','记录实际投入、完成量和异常。'],['合格数量','无权确认','deny','应由质量或人工质检确认。']])}</div><div class="card panel" style="margin-top:12px">${section('交给仓储的输出')}<div class="handoff"><div class="handoff-item"><div class="mark">✓</div><div><b>9 类物料毛需求</b><p>携带任务号、BOM 版本、单位和目标日期。</p></div></div><div class="handoff-item"><div class="mark">!</div><div><b>不可自行判断有货</b><p>生产只产生需求，真实可用库存由仓储计算。</p></div></div></div></div></aside></div>`}
function warehouse(){const rows=materials.map(x=>`<tr class="${x[10]>0?'alert':''}"><td>${x[0]}</td><td>A-${String(materials.indexOf(x)+1).padStart(2,'0')}</td><td class="right">${x[6]}</td><td class="right">${x[7]}</td><td class="right">${x[8]}</td><td class="right"><b>${x[9]}</b></td><td class="right">${x[5]}</td><td class="right ${x[10]>0?'short':'good'}">${x[10]>0?x[10]:'充足'}</td></tr>`).join('');return header('仓储 Agent 工作台','不是只看现存量，而是核对库位、现有、预留、在途和本次需求')+`<div class="layout"><div><div class="card panel">${section('仓储核验步骤')}${steps([['读取需求','接收生产 Agent 的 BOM 毛需求和目标日期。'],['获取库存维度','按仓库、库位、批次读取现有量、已预留和在途量。'],['计算可用量','当前可用 = 现有量 - 已被其他任务预留。'],['生成缺口','缺口 = max（本次需求 - 当前可用，0），交给采购。']])}<div class="formula">本次不把“在途量”直接当作可用量；只有预计到货日在生产领料日期之前且验收入库后，才能用于最终齐套确认。</div>${section('库存分配与缺口表','红色行需要采购')}<div class="table-wrap"><table><thead><tr><th>物料</th><th>库位</th><th class="right">现有</th><th class="right">已预留</th><th class="right">在途</th><th class="right">当前可用</th><th class="right">本次需求</th><th class="right">缺口</th></tr></thead><tbody>${rows}</tbody></table></div></div></div><aside><div class="card panel">${section('仓储需要保存的内容')}${perms([['物料身份','基础字段','read','物料编码、名称、规格、单位、批次/序列号。'],['库存位置','仓储字段','write','仓库、库区、库位、容器和保管责任人。'],['数量状态','仓储事实','write','现有、预留、可用、在途、冻结和待检数量。'],['库存策略','补货字段','approval','安全库存、最小/最大库存、补货倍数和提前期。'],['追溯信息','日志字段','write','入库单、领料单、盘点单、时间和操作人。']])}</div><div class="card panel" style="margin-top:12px">${section('飞书表权限')}${perms([['领料记录','仓储确认写入','write','生产申请，仓库确认实际发料数量。'],['产品物料基础资料','只读','read','不可改产品编码和 BOM。'],['发货清单','执行字段可写','approval','销售发起，仓储填写实际出库和时间。'],['实际库存','唯一维护者','write','采购和生产不得直接修改。']])}</div></aside></div>`}
function purchase(){const shortage=materials.filter(x=>x[10]>0);const rows=shortage.map((x,i)=>`<tr><td>${x[0]}</td><td class="right">${x[10]} ${x[2]}</td><td>${x[12]}</td><td class="right">${money(x[11])}</td><td>${x[13]}</td><td>${i===0?'30台':'按缺口'}</td><td>${[96,94,92,95,93,94][i]}分</td><td><span class="good">推荐</span></td></tr>`).join('');return header('采购 Agent 工作台','采购只处理仓储确认的缺口，并把比价和交期证据提交审批')+`<div class="layout"><div><div class="card panel">${section('采购处理步骤')}${steps([['接收缺口','只接收仓储确认的 6 类缺料，不修改需求数量。'],['匹配供应商','读取供应商物料编码、历史价格、MOQ 和付款条件。'],['询价比选','综合单价、交期、质量、历史准时率和最小订货量。'],['形成申请','生成采购申请草稿，等待 CEO 批准后才可下单。']])}${section('推荐采购组合','预算合计 ¥129,385')}<div class="table-wrap"><table><thead><tr><th>物料</th><th class="right">缺口</th><th>推荐供应商</th><th class="right">含税单价</th><th>交期</th><th>MOQ</th><th>评分</th><th>结论</th></tr></thead><tbody>${rows}</tbody></table></div>${section('关键物料三家报价对比','VFD-075 · 缺口 36 台')}<div class="table-wrap"><table><thead><tr><th>供应商</th><th class="right">单价</th><th>交期</th><th>付款</th><th>历史准时率</th><th>质量评分</th><th>建议</th></tr></thead><tbody><tr><td>华东驱动技术</td><td class="right">¥2,450</td><td>5天</td><td>30天账期</td><td>96%</td><td>96</td><td class="good">综合推荐</td></tr><tr><td>南方自动化</td><td class="right">¥2,380</td><td>9天</td><td>预付30%</td><td>89%</td><td>91</td><td>价格最低</td></tr><tr><td>联控工业</td><td class="right">¥2,520</td><td>3天</td><td>现款</td><td>94%</td><td>94</td><td>交期最快</td></tr></tbody></table></div></div></div><aside><div class="card panel">${section('采购判断规则')}<div class="statusline"><span class="chip">价格权重 30%</span><span class="chip">交期 30%</span><span class="chip">质量 20%</span><span class="chip">履约 15%</span><span class="chip">账期 5%</span></div><div class="formula">不能简单选择最低价。本次目标是备齐 100 套，南方自动化虽然便宜，但 9 天交期可能影响计划，因此推荐 5 天交付且履约更稳定的供应商。</div>${section('权限边界')}${perms([['供应商与询价记录','可写','write','保存报价、交期、MOQ、税率、付款条件和有效期。'],['实际库存','只读','read','采购不能把未到货物料写成库存。'],['采购申请','可创建草稿','write','提交金额和推荐理由。'],['正式下单','必须审批','approval','CEO 批准后才调用飞书写入或外部采购系统。']])}</div></aside></div>`}
function finance(){return header('财务 Agent 工作台','把库存耗用和新增采购统一核算，输出预算影响和审批意见')+`<div class="layout"><div><div class="card panel">${section('成本核算步骤')}${steps([['读取标准成本','读取产品物料基础资料中的成本版本和生效日期。'],['计算库存耗用','按本次实际分配数量 × 库存计价成本。'],['汇总新增采购','使用采购推荐组合的含税金额和预计物流。'],['加入风险准备','对材料成本计提 2% 交期/价格风险准备金。']])}<div class="formula">项目预计总成本 = 现有库存耗用 ¥255,856 + 缺料采购 ¥129,385 + 物流 ¥3,200 + 风险准备金 ¥7,705 = <b>¥396,146</b>。</div>${section('财务总算')}<div class="money"><span>现有库存耗用成本</span><b>¥255,856</b></div><div class="money"><span>缺料采购预算</span><b>¥129,385</b></div><div class="money"><span>预计物流费用</span><b>¥3,200</b></div><div class="money"><span>风险准备金</span><b>¥7,705</b></div><div class="money total"><span>预计总成本</span><b>¥396,146</b></div>${section('审批结论')}<div class="formula">建议批准，但设置两个条件：① VFD-075 到货不晚于目标领料日前 2 天；② 单价超过 ¥2,500 时重新提交审批。</div><button class="btn primary" data-action="approve">批准采购预算</button> <button class="btn" data-action="return">退回采购重新比价</button></div></div><aside><div class="card panel">${section('财务查看与写入范围')}${perms([['生产/库存/采购汇总','只读','read','读取数量与来源单据，不改业务事实。'],['成本分析与预算意见','可写','write','保存成本版本、估算公式和审批意见。'],['真实付款','首期禁止','deny','不连接银行，不允许 Agent 自动付款。'],['预算超限','强制审批','approval','超过项目预算或价格阈值必须重新提交 CEO。']])}${section('需要补充的真实字段')}<div class="statusline"><span class="chip orange">税率</span><span class="chip orange">运费承担方</span><span class="chip orange">库存计价方法</span><span class="chip orange">预算科目</span><span class="chip orange">付款账期</span></div></div></aside></div>`}
function logs(){return header('协作日志与结果追溯','每次计算都能追到输入表、Agent、公式、输出和审批人')+`<div class="card panel"><div class="table-wrap"><table><thead><tr><th>序号</th><th>Agent</th><th>动作</th><th>读取来源</th><th>输出</th><th>状态</th></tr></thead><tbody><tr><td>01</td><td>CEO 总助</td><td>解析 100 套需求</td><td>CEO 指令</td><td>父任务 AC-20261110-001</td><td class="good">完成</td></tr><tr><td>02</td><td>生产 Agent</td><td>展开 BOM V3.2</td><td>产品物料基础资料</td><td>9 类毛需求</td><td class="good">完成</td></tr><tr><td>03</td><td>仓储 Agent</td><td>核对现有/预留/在途</td><td>领料记录、库存台账</td><td>6 类缺口</td><td class="good">完成</td></tr><tr><td>04</td><td>采购 Agent</td><td>供应商比价</td><td>供应商和历史采购记录</td><td>采购预算 ¥129,385</td><td class="good">完成</td></tr><tr><td>05</td><td>财务 Agent</td><td>汇总总成本</td><td>BOM、库存成本、采购方案</td><td>预计 ¥396,146</td><td class="good">完成</td></tr><tr><td>06</td><td>CEO</td><td>审批采购预算</td><td>全部部门结果</td><td>尚未写入真实飞书</td><td class="short">等待审批</td></tr></tbody></table></div>${section('数据来源说明')}<p class="source">用户截图确认了飞书表名，以及产品编码 0001、型号 TCI-4T3.7GB-L、计划生产 650、合格 640、已发货 631、现存 9。其余 BOM、库存、供应商和金额为演示用合成数据。业务字段设计参考 <a target="_blank" href="https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/manufacturing/basic_setup/bill_configuration.html">Odoo BOM 文档</a>、<a target="_blank" href="https://www.odoo.com/documentation/19.0/applications/inventory_and_mrp/inventory/warehouses_storage/reporting/forecast.html">库存预测字段</a>、<a target="_blank" href="https://www.odoo.com/documentation/18.0/applications/inventory_and_mrp/purchase/manage_deals/rfq.html">采购询价文档</a>和 <a target="_blank" href="https://learn.microsoft.com/en-us/dynamics365/supply-chain/production-control/bill-of-material-bom">Dynamics 365 BOM 文档</a>，不能替代企业自身 BOM、库存台账或正式报价。</p></div>`}
const renderers={overview,assistant,production,warehouse,purchase,finance,logs};function go(page){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));$('#app').innerHTML=renderers[page]();wire();scrollTo(0,0)}function wire(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));const run=$('#runTask');if(run)run.onclick=()=>{taskRun=true;toast('协作任务已完成模拟计算，可进入各部门查看细节');go('overview')};document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>toast(e.dataset.action==='approve'?'已模拟批准，不会写入真实飞书':'已退回采购 Agent 重新比价'))}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.page));go('overview');
</script></body></html>
