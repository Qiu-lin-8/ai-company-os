<style>

.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}.brand b{display:block;font-size:15px}.brand small{display:block;color:rgba(255,255,255,.7);font-size:13px}
.logo{position:relative;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#e5ff82,#bce95b);color:var(--green);display:grid;place-items:center;font-weight:900;overflow:hidden;box-shadow:0 8px 24px rgba(217,247,107,.2)}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,247,107,.5)}70%{box-shadow:0 0 0 7px rgba(217,247,107,0)}100%{box-shadow:0 0 0 0 rgba(217,247,107,0)}}
main{min-width:0;padding:28px 34px 56px}

.kpi small{display:block;color:var(--muted);font-size:13px}.kpi b{display:block;font-size:26px;letter-spacing:-.5px;margin:2px 0;line-height:1.25}.kpi b.t{font-size:17px;margin:6px 0}.kpi em{font-style:normal;font-size:13px;color:var(--green2)}.kpi em.w{color:var(--orange)}.kpi em.r{color:var(--red)}
.hero{position:relative;overflow:hidden;padding:20px 22px;margin-bottom:14px;color:#f5fff9;background:linear-gradient(125deg,#0d3b30 0%,#155342 60%,#0e493d 100%);border-color:rgba(255,255,255,.12);box-shadow:0 22px 60px rgba(13,65,49,.2)}
.hero:after{content:"";position:absolute;width:240px;height:240px;right:-90px;bottom:-150px;border:1px solid rgba(217,247,107,.28);border-radius:50%;box-shadow:0 0 0 28px rgba(217,247,107,.04),0 0 0 56px rgba(217,247,107,.025)}
.hero h2{margin:0 0 2px;font-size:18px}.hero p{margin:0;color:rgba(255,255,255,.75)}.hero .hl{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}.hero .hl span{font-size:13px;color:rgba(255,255,255,.85)}.hero .hl b{color:var(--lime);font-size:18px;margin-right:4px}

table{width:100%;border-collapse:collapse;font-size:14px}

td{padding:9px 8px;border-bottom:1px solid #edf1ee;vertical-align:top}tr:last-child td{border-bottom:0}tbody tr:hover td{background:rgba(217,247,107,.1)}

tr.warn td{background:#fff7ea}tr.bad td{background:#fdeeec}
.bar{height:7px;background:#e6eee8;border-radius:9px;overflow:hidden;min-width:72px}.bar>div{height:100%;background:linear-gradient(90deg,var(--green2),#8bd04f);border-radius:9px}.bar.low>div{background:linear-gradient(90deg,var(--orange),#f0b25a)}
.pill{display:inline-block;padding:0 10px;border-radius:99px;font-size:13px;line-height:1.7;background:#eef1ef;color:var(--muted);white-space:nowrap}.pill.g{background:#e2f0e8;color:var(--green2)}.pill.o{background:#fff0dc;color:#9c581d}.pill.r{background:#fbe7e4;color:var(--red)}.pill.b{background:#e3f0f5;color:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:9px;cursor:pointer;font-size:14px}.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
.alert{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #edf1ee}.alert:last-child{border-bottom:0}.alert b{display:block;font-size:14px}.alert span{color:var(--muted);font-size:13px}.sev{flex:0 0 4px;border-radius:4px;background:var(--orange)}.sev.r{background:var(--red)}.sev.i{background:var(--blue)}
.demo-box{border:1px dashed #e3c99a;background:#fffaf0;border-radius:var(--radius);padding:13px 16px;font-size:14px;color:#7a5522;margin-bottom:14px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:3px 11px;border-radius:99px;background:#eef1ef;color:var(--muted);font-size:13px}.chip.r{background:#fbe7e4;color:var(--red)}.chip.o{background:#fff0dc;color:#9c581d}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.step{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.step b{display:block;font-size:14px}.step p{margin:3px 0 0;color:var(--muted);font-size:13px}
.num{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;margin-bottom:6px}
.perm{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #edf1ee}.perm:last-child{border-bottom:0}.perm p{margin:0;color:var(--muted);font-size:13px}.perm .k{white-space:nowrap;font-size:13px}.k.read{color:var(--blue)}.k.write{color:var(--green2)}.k.approval{color:var(--orange)}.k.deny{color:var(--red)}
.money{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.money.total{font-size:16px;font-weight:800;border-top:2px solid var(--green);border-bottom:0}
.formula{background:#eef4f0;border-left:3px solid var(--green2);padding:10px 14px;border-radius:8px;color:#415048;margin:12px 0}
textarea{width:100%;min-height:54px;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.1);color:#fff;font:inherit;resize:vertical}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#dffb77,#bfe959);color:#173526;border-color:#dffb77;font-weight:700}
.toast{position:fixed;right:22px;bottom:22px;z-index:50;background:rgba(11,44,34,.95);color:#fff;padding:11px 16px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
a{color:var(--blue)}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid rgba(39,125,150,.35);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:1180px){.sec{display:none}}

@media(max-width:860px){.shell{display:block}.side{position:relative;height:auto;padding:12px}.brand{padding-bottom:10px}.gt,.foot .l2{display:none}.side nav{display:flex;gap:6px;overflow-x:auto}.nav{flex:0 0 auto;width:auto;padding:7px 12px}.nav .tag,.nav .demo-tag{margin-left:4px}.nav.active:before{display:none}.foot{margin-top:10px}main{padding:18px 12px 40px}.top{flex-direction:column}.top h1{font-size:23px}}

</style></head><body>
<a class="skip-link" href="#app">跳到主要内容</a>
<div class="shell"><aside class="side"><div class="brand"><div class="logo">AC</div><div><b>AI Company OS</b><small>部门工作台</small></div></div>
<nav aria-label="部门工作台导航"><div class="gt">公司协作</div>
<button class="nav" data-p="overview">总览</button>
<button class="nav" data-p="assistant">CEO 总助<span class="demo-tag">示例</span></button>
<div class="gt">业务部门</div>
<button class="nav" data-p="production">生产<span class="tag" id="nProd" hidden></span></button>
<button class="nav" data-p="warehouse">仓储<span class="tag" id="nWh" hidden></span></button>
<button class="nav" data-p="purchase">采购<span class="tag" id="nBuy" hidden></span></button>
<button class="nav" data-p="finance">财务<span class="demo-tag">示例</span></button>
<div class="gt">追溯与治理</div>
<button class="nav" data-p="logs">协作日志</button></nav>
<div class="foot" id="foot"><span class="dot warn"></span><b>正在连接飞书…</b></div></aside>
<main id="app" tabindex="-1"></main></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v.join('、'):(v==null?'':v);
const num=v=>{const x=Array.isArray(v)?v[0]:v;const n=+x;return Number.isFinite(n)?n:0};
const pct=n=>Math.round(n*100)+'%';
const sum=(a,k)=>a.reduce((s,r)=>s+num(r[k]),0);
const day=v=>String(arr(v)).replace(/T.*/,'');
const PAGES=['overview','assistant','production','warehouse','purchase','finance','logs'];
const state={data:null,status:null,changes:[],err:null,tab:'records',page:'overview',live:false,fetchFail:false,seq:null};
const LOW=0.3;

/* ---------- 时间 ---------- */
const bj=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const fmtT=iso=>iso?bj.format(new Date(iso)).replace(/\//g,'-'):'—';
const ago=iso=>{if(!iso)return '—';const s=Math.max(0,(Date.now()-new Date(iso))/1000);return s<90?'刚刚':s<3600?Math.round(s/60)+' 分钟前':Math.round(s/3600)+' 小时前'};

/* ---------- 取数 ---------- */
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});const b=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(b.error||('HTTP '+r.status));e.status=r.status;throw e}return b}
async function loadData(){
  try{const d=await getJSON('/api/base/data');state.data=d;state.seq=d.seq;state.status=d.status;state.err=null;state.fetchFail=false;
    try{state.changes=(await getJSON('/api/base/changes?limit=60')).changes||[]}catch{}
  }catch(e){state.err=e.status===503?'飞书数据尚未完成首次同步，请稍候…':'无法读取数据：'+e.message;state.fetchFail=!state.data}
  paint();
}
async function pollStatus(){
  try{const s=await getJSON('/api/base/status');state.status=s;state.fetchFail=false;
    if(!state.data||s.seq!==state.seq||(state.data.status&&s.last_sync_at!==state.data.status.last_sync_at&&s.seq!==state.seq))await loadData();else{renderFoot()}
  }catch{state.fetchFail=true;renderFoot()}
}
function startLive(){
  if(window.EventSource){
    try{const es=new EventSource('/api/base/stream');
      es.onopen=()=>{state.live=true;renderFoot()};
      es.addEventListener('sync',()=>loadData());
      es.onerror=()=>{state.live=false;renderFoot()};
    }catch{}
  }
  setInterval(pollStatus,30000); // 兜底轮询(SSE 被隧道缓冲/断开时仍能更新)
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollStatus()});
}

/* ---------- 数据读取 ---------- */
const T=name=>((state.data&&state.data.tables[name])||{records:[]}).records;
function model(){
  const S=T('生产完成汇总表'),blank=S.filter(r=>!r['产品名称']).length;
  const m={S:S.filter(r=>r['产品名称']),blank,W:T('生产工单'),P:T('领料记录'),R:T('生产记录'),F:T('发货清单'),M:T('产品物料基础资料'),VU:T('变频器使用情况记录'),VF:T('变频器故障记录')};
  m.mats=m.M.filter(x=>x['类型']==='物料');
  const ratio=x=>num(x['目前库存'])?num(x['剩余库存'])/num(x['目前库存']):1;
  m.ratio=ratio;
  m.low=m.mats.filter(x=>ratio(x)<LOW);
  m.short=m.P.filter(p=>num(p['实领数量'])<num(p['应领数量']));
  m.odd=m.W.filter(w=>w['当前状态']==='待生产'&&num(w['已完工数量'])>0);
  m.pendShip=m.F.filter(f=>f['发货状态']==='待发货');
  m.unrepaired=m.VF.filter(f=>!f['维修完成时间']);
  const al=[];
  m.odd.forEach(w=>al.push({lv:'r',dept:'生产',t:`工单 ${w['工单号']} 状态为「${w['当前状态']}」但已完工 ${num(w['已完工数量'])} 套`,s:'状态与数量不一致，请核对',go:'production'}));
  m.short.forEach(p=>al.push({lv:'r',dept:'仓储',t:`领料 ${p['领料单号']} 欠领 ${num(p['应领数量'])-num(p['实领数量'])} ${arr(p['单位'])}`,s:`${arr(p['物料名称'])}：应领 ${num(p['应领数量'])} / 实领 ${num(p['实领数量'])}`,go:'warehouse'}));
  m.low.forEach(x=>al.push({lv:'o',dept:'采购',t:`${x['名称']} 剩余库存仅 ${pct(ratio(x))}`,s:`剩 ${num(x['剩余库存'])} / ${num(x['目前库存'])} ${arr(x['单位'])} · ${arr(x['供应商'])}`,go:'purchase'}));
  m.pendShip.forEach(f=>al.push({lv:'i',dept:'仓储',t:`发货单 ${f['发货单号']} 待发货 ${num(f['发货数量'])} 台`,s:arr(f['产品名称']),go:'warehouse'}));
  m.unrepaired.forEach(f=>al.push({lv:'o',dept:'生产',t:`变频器 ${f['S\\N']} 返厂未修复`,s:arr(f['返厂故障原因']),go:'production'}));
  m.alerts=al;m.urgent=al.filter(a=>a.lv==='r').length;
  return m;
}

/* ---------- 小组件 ---------- */
const stCls=s=>({生产中:'b',测试完成:'g',已领料:'o',待生产:'r',已发货:'b',已完成:'g',已签收:'g',待发货:'o'}[s]||'');
const pill=s=>`<span class="pill ${stCls(s)}">${esc(arr(s))||'—'}</span>`;
const bar=(v,low)=>`<div class="bar ${low?'low':''}"><div style="width:${Math.max(0,Math.min(100,v*100))}%"></div></div>`;
const src=(names,note)=>{const t=state.data&&state.data.synced_at;return `<span class="src"><b>飞书 · ${esc(names)}</b>${note?' · '+esc(note):''} · 同步于 ${fmtT(t)}</span>`};
const demoSrc=()=>`<span class="src demo"><b>示例数据</b> · 非飞书真实数据</span>`;
const H=(t,right)=>`<div class="h"><h2>${t}</h2>${right||''}</div>`;
const kpi=(l,v,n,cls,go)=>`<div class="card kpi ${go?'link':''}" ${go?`data-go="${go}"`:''}><small>${l}</small><b>${v}</b><em class="${cls||''}">${n}</em></div>`;
const head=(t,s,badge)=>`<div class="top"><div><div class="eyebrow">AI OPERATIONS CONSOLE</div><h1>${t}</h1><div class="sub">${s}</div></div>${badge===undefined?liveBadge():badge}</div>`;
const demoBadge='<span class="badge demo">示例数据</span>';
function liveBadge(){const s=state.status;if(!s||state.fetchFail)return '<span class="badge demo">未连接</span>';return `<span class="badge"><span class="dot ${s.ok?'':'warn'}"></span>飞书${s.mode==='push'?'实时推送':'数据'} · ${ago(s.last_sync_at)}同步</span>`}
const alertList=(list,n)=>list.slice(0,n).map(a=>`<div class="alert"><div class="sev ${a.lv}"></div><div><b>${esc(a.t)}</b><span>${esc(a.dept)} · ${esc(a.s)}</span></div></div>`).join('')||'<div class="empty">暂无需要关注的事项 🎉</div>';
function woTable(m){return `<div class="tw"><table><thead><tr><th>工单号</th><th>产品</th><th>状态</th><th style="width:130px">进度</th><th class="r">完工/计划</th><th class="r sec">合格</th><th class="r">不良</th><th class="r">已发货</th></tr></thead><tbody>${m.W.map(w=>`<tr class="${m.odd.includes(w)?'warn':''}"><td class="nw">${esc(w['工单号'])}</td><td>${esc(arr(w['产品名称']))}</td><td>${pill(w['当前状态'])}</td><td>${bar(num(w['生产进度']))}</td><td class="r nw">${num(w['已完工数量'])}/${num(w['计划数量'])}</td><td class="r sec">${num(w['合格数量'])}</td><td class="r">${num(w['不良数量'])}</td><td class="r">${num(w['已发货数量'])}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">暂无工单</td></tr>'}</tbody></table></div>`}
function table(cols,rows,rowCls){return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.cls||''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${rowCls?rowCls(r):''}">${cols.map(c=>`<td class="${c.cls||''}">${c.f(r)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="empty">暂无记录</td></tr>`}</tbody></table></div>`}

/* ---------- 页面(真实数据) ---------- */
const pages={
overview(m){
  const plan=sum(m.S,'计划生产套数'),ok=sum(m.S,'合格套数'),ship=sum(m.S,'已发货套数');
  return head('总览','今天需要你关注的事 · 数字全部来自飞书多维表格')+
  `<section class="card hero"><h2>今日概况</h2><p>${m.W.length} 张工单 · ${m.S.length} 个产品 · ${m.mats.length} 种物料</p><div class="hl"><span><b>${m.urgent}</b>项需立即核对</span><span><b>${m.alerts.length-m.urgent}</b>项提醒</span><span><b>${m.W.filter(w=>w['当前状态']==='生产中').length}</b>张工单生产中</span></div></section>
  <div class="kpis">${kpi('计划生产',plan+' 套',m.S.length+' 个产品')}${kpi('合格完成',ok+' 套','占计划 '+(plan?pct(ok/plan):'—'))}${kpi('已发货',ship+' 套','发货单 '+m.F.length+' 张')}${kpi('待处理',m.alerts.length+' 项',m.urgent+' 项需立即核对',m.urgent?'r':'')}</div>
  <div class="grid2"><div>${H('生产工单进度',src('生产工单'))}<div class="card panel">${woTable(m)}</div></div>
  <div>${H('需要关注',`<span class="src">由各部门 Agent 汇总</span>`)}<div class="card panel">${alertList(m.alerts,7)}</div></div></div>
  ${H('部门 Agent 状态','<span class="src">点击进入部门工作台</span>')}<div class="kpis">
  ${kpi('生产 Agent',m.W.filter(w=>w['当前状态']==='生产中').length+' 张在产',m.odd.length?m.odd.length+' 项状态待核对':'工单状态正常',m.odd.length?'r':'','production')}
  ${kpi('仓储 Agent',m.P.length+' 条领料',m.short.length?m.short.length+' 条欠领':'领料齐套',m.short.length?'r':'','warehouse')}
  ${kpi('采购 Agent',m.low.length+m.short.length+' 项待询价',m.low.length+' 种库存偏低','w','purchase')}
  ${kpi('财务 Agent','示例数据','待接入成本字段','','finance')}</div>`},

production(m){
  const rec=table([{h:'记录',f:r=>esc(r['生产记录编号'])},{h:'日期',cls:'nw',f:r=>day(r['生产日期'])},{h:'工单',cls:'nw',f:r=>esc(arr(r['工单号']))},{h:'产品',cls:'sec',f:r=>esc(arr(r['产品名称']))},{h:'完工',cls:'r',f:r=>num(r['完工数量'])},{h:'不良',cls:'r',f:r=>num(r['不良数量'])},{h:'不良原因',f:r=>esc(arr(r['不良原因']))},{h:'生产异常',cls:'sec',f:r=>esc(arr(r['生产异常']))}],m.R.slice().sort((a,b)=>String(day(b['生产日期'])).localeCompare(day(a['生产日期']))));
  const sns=[...new Set([...m.VU.map(x=>x['S\\N']),...m.VF.map(x=>x['S\\N'])].filter(Boolean))];
  const vf=sns.map(sn=>({sn,u:m.VU.find(x=>x['S\\N']===sn)||{},f:m.VF.filter(x=>x['S\\N']===sn)}));
  const after=table([{h:'序列号',cls:'nw',f:r=>esc(r.sn)},{h:'型号',cls:'nw',f:r=>esc(arr(r.u['型号']||(r.f[0]||{})['型号']))},{h:'使用情况',f:r=>esc(arr(r.u['备注']))||'<span class="mut">—</span>'},{h:'更换',f:r=>r.u['更换']?pill(r.u['更换']==='是'?'已更换':'未更换').replace('pill','pill '+(r.u['更换']==='是'?'o':'')):'—'},{h:'返厂故障',f:r=>r.f.map(x=>esc(arr(x['返厂故障原因']))).join('；')||'<span class="mut">无</span>'},{h:'维修事项',cls:'sec',f:r=>r.f.map(x=>esc(arr(x['维修事项']))).join('；')},{h:'返厂/完成',cls:'sec nw',f:r=>r.f.map(x=>day(x['返厂时间'])+' → '+(day(x['维修完成时间'])||'维修中')).join('<br>')}],vf);
  return head('生产','生产完成汇总 · 工单进度 · 生产记录 · 变频器售后')+
  `${H('生产完成汇总',src('生产完成汇总表',m.blank?`已忽略 ${m.blank} 条空白记录`:''))}<div class="kpis">${m.S.map(r=>kpi(esc(arr(r['产品名称'])),num(r['合格套数'])+' / '+num(r['计划生产套数']),`合格完成率 ${pct(num(r['合格率']))} · 已发货 ${num(r['已发货套数'])} · 现存 ${num(r['现存量'])}`,num(r['合格率'])<.5?'w':'')).join('')||'<div class="card empty">暂无数据</div>'}</div>
  ${H('工单进度',src('生产工单'))}<div class="card panel">${woTable(m)}</div>
  ${H('明细',src(state.tab==='records'?'生产记录':'变频器使用情况记录 + 变频器故障记录'))}<div class="card panel"><div class="tabs"><button data-tab="records" class="${state.tab==='records'?'on':''}">生产记录 ${m.R.length}</button><button data-tab="after" class="${state.tab==='after'?'on':''}">变频器售后 ${vf.length}</button></div>${state.tab==='records'?rec:after}</div>`},

warehouse(m){
  return head('仓储','物料库存 · 领料对账 · 发货')+
  `<div class="kpis">${kpi('物料种类',m.mats.length,'产品物料基础资料')}${kpi('库存偏低',m.low.length+' 种','剩余库存 < 30%',m.low.length?'w':'')}${kpi('欠领单',m.short.length+' 条','实领 < 应领',m.short.length?'r':'')}${kpi('待发货',m.pendShip.length+' 张','发货清单',m.pendShip.length?'w':'')}</div>
  <div class="grid2"><div>${H('物料库存',src('产品物料基础资料'))}<div class="card panel">${table([{h:'编码',cls:'nw',f:r=>esc(r['编码'])},{h:'物料',f:r=>esc(arr(r['名称']))},{h:'目前库存',cls:'r',f:r=>num(r['目前库存'])},{h:'剩余库存',cls:'r',f:r=>num(r['剩余库存'])},{h:'剩余比例',f:r=>bar(m.ratio(r),m.ratio(r)<LOW)},{h:'供应商',cls:'sec',f:r=>esc(arr(r['供应商']))}],m.mats,r=>m.ratio(r)<LOW?'warn':'')}</div></div>
  <div>${H('领料对账',src('领料记录'))}<div class="card panel">${table([{h:'领料单',cls:'nw',f:r=>esc(String(r['领料单号']).replace(/^LL-/,''))},{h:'物料',f:r=>esc(arr(r['物料名称']))},{h:'应领',cls:'r',f:r=>num(r['应领数量'])},{h:'实领',cls:'r',f:r=>num(r['实领数量'])}],m.P,r=>num(r['实领数量'])<num(r['应领数量'])?'warn':'')}</div></div></div>
  ${H('发货清单',src('发货清单'))}<div class="card panel">${table([{h:'发货单号',cls:'nw',f:r=>esc(r['发货单号'])},{h:'产品',f:r=>esc(arr(r['产品名称']))},{h:'工单',cls:'nw',f:r=>esc(arr(r['工单号']))},{h:'数量',cls:'r',f:r=>num(r['发货数量'])},{h:'状态',f:r=>pill(r['发货状态'])}],m.F)}</div>`},

purchase(m){
  const rows=[];
  m.low.forEach(x=>rows.push({code:x['编码'],name:arr(x['名称']),why:`库存偏低：剩 ${pct(m.ratio(x))}`,sup:arr(x['供应商']),qty:Math.max(0,Math.ceil(num(x['目前库存'])*LOW)-num(x['剩余库存'])),unit:arr(x['单位']),qtyNote:'补至 30%'}));
  m.short.forEach(p=>{const mat=m.M.find(x=>x['编码']===p['物料编码'])||{};const ex=rows.find(r=>r.code===p['物料编码']);const gap=num(p['应领数量'])-num(p['实领数量']);
    if(ex){ex.why+=`；欠领 ${gap}`;ex.qty=Math.max(ex.qty,gap);ex.qtyNote='取较大值'}else rows.push({code:p['物料编码'],name:arr(p['物料名称']),why:`欠领 ${gap} ${arr(p['单位'])}（${esc(p['领料单号'])}）`,sup:arr(mat['供应商'])||'—',qty:gap,unit:arr(p['单位']),qtyNote:'补欠领'})});
  return head('采购','由库存偏低和欠领单自动生成待询价清单')+
  `<div class="kpis">${kpi('待询价',rows.length+' 项','自动生成',rows.length?'w':'')}${kpi('涉及供应商',new Set(rows.map(r=>r.sup)).size+' 家','来自产品物料基础资料')}${kpi('库存偏低',m.low.length+' 种','剩余 < 30%')}${kpi('欠领物料',m.short.length+' 种','来自领料记录')}</div>
  ${H('待询价清单',src('产品物料基础资料 + 领料记录'))}<div class="card panel">${table([{h:'物料',f:r=>esc(r.name)+`<br><span class="mut">${esc(r.code)}</span>`},{h:'原因',f:r=>esc(r.why)},{h:'供应商',cls:'sec',f:r=>esc(r.sup)},{h:'建议数量',cls:'r nw',f:r=>`<b>${r.qty}</b> ${esc(r.unit)}<br><span class="mut">${esc(r.qtyNote)}</span>`},{h:'状态',f:r=>'<span class="pill o">待询价</span>'}],rows,()=> 'warn')}</div>
  ${H('询价比价',demoSrc())}<div class="demo-box">飞书表里还没有「供应商报价 / MOQ / 交期」字段，询价比价暂无真实数据。建议在飞书新增「采购询价」表；接入后这里会自动替换为真实比价。</div>`}
};

/* ---------- 页面(示例数据) ---------- */
function assistant(m){
  return head('CEO 总助','协调者只创建任务和汇总结果，不直接修改业务原始记录',demoBadge)+
  (m?`${H('今日简报',src('综合各部门表格'))}<div class="card panel">${alertList(m.alerts,6)}</div>`:'')+
  `${H('任务拆解示例',demoSrc())}<section class="card hero"><h2>向公司下达任务</h2><p>演示：一句 CEO 指令如何拆给生产、仓储、采购、财务（不会真实执行或写入飞书）</p><div style="display:flex;gap:10px;margin-top:12px"><textarea id="req" aria-label="任务内容">我要准备 100 套配件。请生产列清单，仓储核库存，采购处理缺口，财务汇总总成本。</textarea><button class="btn primary" id="runTask">执行任务</button></div></section>
  <div class="grid2"><div class="card panel"><div class="steps">${[['总助解析需求','识别产品、数量和需要参与的部门。'],['生产生成清单','读取产品物料资料，计算毛需求。'],['仓储核验库存','可用量 = 现有 - 已预留，生成缺口。'],['采购核实缺料','询价比价，比较单价、交期和 MOQ。'],['财务汇总成本','库存耗用 + 采购 + 物流 + 风险准备金。'],['CEO 审批执行','批准后才生成采购任务和飞书写入请求。']].map((s,i)=>`<div class="step"><div class="num">${i+1}</div><b>${s[0]}</b><p>${s[1]}</p></div>`).join('')}</div></div>
  <aside class="card panel"><b>权限边界</b>${[['所有业务汇总','只读','read','查看生产、仓储、采购、财务摘要和来源。'],['任务与审批记录','可写','write','创建父子任务、更新协作状态。'],['业务原始数据','禁止直接写','deny','不得修改库存、工单完成量、采购价或财务流水。']].map(p=>`<div class="perm"><div><b style="font-size:14px">${p[0]}</b><p>${p[3]}</p></div><span class="k ${p[2]}">${p[1]}</span></div>`).join('')}</aside></div>`}
function finance(){
  return head('财务','把库存耗用和新增采购统一核算，输出预算影响和审批意见',demoBadge)+
  `<div class="demo-box"><b>示例数据</b>：飞书 8 张表里还没有成本 / 单价字段，本页数字是演示。建议在「产品物料基础资料」增加「单价」列，即可由库存 × 单价算出真实占用资金。</div>
  <div class="grid2"><div class="card panel"><div class="formula">项目预计总成本 = 现有库存耗用 ¥255,856 + 缺料采购 ¥129,385 + 物流 ¥3,200 + 风险准备金 ¥7,705 = <b>¥396,146</b></div>
  <div class="money"><span>现有库存耗用成本</span><b>¥255,856</b></div><div class="money"><span>缺料采购预算</span><b>¥129,385</b></div><div class="money"><span>预计物流费用</span><b>¥3,200</b></div><div class="money"><span>风险准备金</span><b>¥7,705</b></div><div class="money total"><span>预计总成本</span><b>¥396,146</b></div>
  <div class="formula">建议批准，但设置两个条件：① 关键物料到货不晚于目标领料日前 2 天；② 单价超过阈值时重新提交审批。</div>
  <button class="btn primary" data-action="approve">批准采购预算</button> <button class="btn" data-action="return">退回采购重新比价</button></div>
  <aside class="card panel"><b>财务查看与写入范围</b>${[['生产/库存/采购汇总','只读','read','读取数量与来源单据，不改业务事实。'],['成本分析与预算意见','可写','write','保存成本版本、估算公式和审批意见。'],['真实付款','首期禁止','deny','不连接银行，不允许 Agent 自动付款。'],['预算超限','强制审批','approval','超过预算或价格阈值须重新提交 CEO。']].map(p=>`<div class="perm"><div><b style="font-size:14px">${p[0]}</b><p>${p[3]}</p></div><span class="k ${p[2]}">${p[1]}</span></div>`).join('')}</aside></div>`}
function logs(){
  const lab={added:'新增',updated:'更新',removed:'删除',table_added:'新增数据表',table_removed:'删除数据表',initial_sync:'首次同步'};
  const ch=state.changes.slice().reverse();
  return head('协作日志与结果追溯','飞书表格的每次变更都会自动记录')+
  `${H('飞书表格变更记录',src('变更日志'))}<div class="card panel">${table([{h:'时间（北京）',cls:'nw',f:c=>fmtT(c.ts)},{h:'数据表',cls:'nw',f:c=>esc(c.table||'—')},{h:'变更',f:c=>`<span class="pill ${c.type==='added'?'g':c.type==='removed'?'r':'b'}">${lab[c.type]||esc(c.type)}</span>`},{h:'内容',f:c=>c.type==='initial_sync'?'首次同步 '+Object.values(c.counts||{}).reduce((a,b)=>a+b,0)+' 条记录':esc(c.label||'')+(c.fields&&c.fields.length?`<br><span class="mut">字段：${esc(c.fields.slice(0,8).join('、'))}${c.fields.length>8?'…':''}</span>`:'')}],ch)}</div>
  ${H('Agent 协作链路示例',demoSrc())}<div class="card panel">${table([{h:'序号',f:r=>r[0]},{h:'Agent',cls:'nw',f:r=>r[1]},{h:'动作',f:r=>r[2]},{h:'读取来源',cls:'sec',f:r=>r[3]},{h:'状态',f:r=>r[4]}],[['01','CEO 总助','解析需求','CEO 指令','完成'],['02','生产 Agent','展开物料需求','产品物料基础资料','完成'],['03','仓储 Agent','核对库存','领料记录、库存','完成'],['04','采购 Agent','供应商比价','报价记录','完成'],['05','财务 Agent','汇总总成本','库存成本、采购方案','完成'],['06','CEO','审批采购预算','全部部门结果','等待审批']].map(r=>r))}</div>`}

/* ---------- 渲染 ---------- */
function body(){
  const p=state.page;
  if(p==='finance')return finance();
  if(p==='logs'&&true)return logs();
  if(!state.data){return head({overview:'总览',assistant:'CEO 总助',production:'生产',warehouse:'仓储',purchase:'采购'}[p]||'',state.err||'正在读取飞书数据…','<span class="badge demo">'+(state.fetchFail?'未连接':'读取中')+'</span>')+`<div class="card empty">${esc(state.err||'正在读取飞书多维表格数据…')}</div>`}
  const m=model();
  if(p==='assistant')return assistant(m);
  return pages[p](m);
}
function paint(){
  const y=scrollY;
  const app=$('#app');app.innerHTML=body();
  wire();renderFoot();renderTags();
  scrollTo(0,y);
}
function renderTags(){
  if(!state.data){['nProd','nWh','nBuy'].forEach(i=>$('#'+i).hidden=true);return}
  const m=model();const set=(id,n)=>{const e=$('#'+id);e.hidden=!n;e.textContent=n};
  set('nProd',m.odd.length+m.unrepaired.length);set('nWh',m.short.length);set('nBuy',m.low.length+m.short.length);
}
function renderFoot(){
  const s=state.status,f=$('#foot');
  document.querySelectorAll('.top .badge:not(.demo)').forEach(b=>b.outerHTML=liveBadge());
  if(state.fetchFail||!s){f.innerHTML=`<span class="dot bad"></span><b>服务连接中断</b><div class="l2">无法访问数据服务，页面显示最后一次读取的数据；将自动重试。</div>`;return}
  const stale=s.last_sync_at&&(Date.now()-new Date(s.last_sync_at))>5*60000;
  const cls=!s.ok?'warn':stale?'warn':'';
  f.innerHTML=`<span class="dot ${cls}"></span><b>${!s.ok?'同步异常，显示上次数据':stale?'同步可能延迟':'飞书多维表格已连接'}</b><div class="l2">最后同步 ${fmtT(s.last_sync_at)}（北京）<br>${s.mode==='push'?'实时推送 + 轮询兜底':'每 60 秒轮询'}${state.live?' · 页面实时通道在线':' · 页面每 30 秒自动检查'}</div>`;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function wire(){
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{location.hash='#/'+e.dataset.go});
  document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;paint()});
  const run=$('#runTask');if(run)run.onclick=()=>toast('示例：协作任务已模拟计算，不会写入飞书');
  document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>toast(e.dataset.action==='approve'?'已模拟批准，不会写入真实飞书':'已模拟退回采购重新比价'));
}
function route(){
  const h=(location.hash||'').replace(/^#\/?/,'').split(/[/?]/)[0];
  const p=PAGES.includes(h)?h:'overview';
  const changed=p!==state.page;state.page=p;
  document.querySelectorAll('.nav').forEach(n=>{const a=n.dataset.p===p;n.classList.toggle('active',a);n.setAttribute('aria-current',a?'page':'false')});
  document.title='AI Company OS · '+({overview:'总览',assistant:'CEO 总助',production:'生产',warehouse:'仓储',purchase:'采购',finance:'财务',logs:'协作日志'}[p]);
  paint();if(changed)scrollTo(0,0);
}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{location.hash='#/'+n.dataset.p});
addEventListener('hashchange',route);
route();loadData();startLive();
</script></body></html>
