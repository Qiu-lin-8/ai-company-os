/* ---------- 取数 ---------- */
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});const b=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(b.error||('HTTP '+r.status));e.status=r.status;throw e}return b}
async function postJSON(u,body){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const b=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(b.error||('HTTP '+r.status));e.status=r.status;throw e}return b}
async function loadData(){
  try{const d=await getJSON('/api/base/data');state.data=d;state.seq=d.seq;state.status=d.status;state.err=null;state.fetchFail=false;
    try{state.changes=(await getJSON('/api/base/changes?limit=500')).changes||[]}catch{}
  }catch(e){state.err=e.status===503?'飞书数据尚未完成首次同步，请稍候…':'无法读取数据：'+e.message;state.fetchFail=!state.data}
  paint();
}
async function loadLatestTask(){
  try{const b=await getJSON('/api/tasks?limit=1');if(b.tasks&&b.tasks[0]){state.task=b.tasks[0];state.taskStage=5;paint()}}
  catch(e){if(e.status!==403)state.taskError='无法读取任务记录：'+e.message}
}
async function pollStatus(){
  try{const s=await getJSON('/api/base/status');state.status=s;state.fetchFail=false;
    if(!state.data||s.seq!==state.seq||(state.data.status&&s.last_sync_at!==state.data.status.last_sync_at&&s.seq!==state.seq))await loadData();else{renderFoot()}
  }catch{state.fetchFail=true;renderFoot()}
}
function startLive(){
  if(window.EventSource){
    try{const es=new EventSource('/api/base/stream');
      es.onopen=()=>{state.live=true;renderFoot()};
      es.addEventListener('sync',()=>loadData());
      es.onerror=()=>{state.live=false;renderFoot()};
    }catch{}
  }
  setInterval(pollStatus,30000); // 兜底轮询(SSE 被隧道缓冲/断开时仍能更新)
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollStatus()});
}

/* ---------- 数据读取 ---------- */
const T=name=>((state.data&&state.data.tables[name])||{records:[]}).records;
function model(){
  const S=T('生产完成汇总表'),blank=S.filter(r=>!r['产品名称']).length;
  const m={S:S.filter(r=>r['产品名称']),blank,W:T('生产工单'),P:T('领料记录'),R:T('生产记录'),F:T('发货清单'),M:T('产品物料基础资料'),VU:T('变频器使用情况记录'),VF:T('变频器故障记录')};
  m.mats=m.M.filter(x=>x['类型']==='物料');
  const ratio=x=>num(x['目前库存'])?num(x['剩余库存'])/num(x['目前库存']):1;
  m.ratio=ratio;
  m.low=m.mats.filter(x=>ratio(x)<LOW);
  m.short=m.P.filter(p=>num(p['实领数量'])<num(p['应领数量']));
  m.odd=m.W.filter(w=>w['当前状态']==='待生产'&&num(w['已完工数量'])>0);
  m.pendShip=m.F.filter(f=>f['发货状态']==='待发货');
  m.unrepaired=m.VF.filter(f=>!f['维修完成时间']);
  const al=[];
  m.odd.forEach(w=>al.push({lv:'r',dept:'生产',t:`工单 ${w['工单号']} 状态为「${w['当前状态']}」但已完工 ${num(w['已完工数量'])} 套`,s:'状态与数量不一致，请核对',go:'production'}));
  m.short.forEach(p=>al.push({lv:'r',dept:'仓储',t:`领料 ${p['领料单号']} 欠领 ${num(p['应领数量'])-num(p['实领数量'])} ${arr(p['单位'])}`,s:`${arr(p['物料名称'])}：应领 ${num(p['应领数量'])} / 实领 ${num(p['实领数量'])}`,go:'warehouse'}));
  m.low.forEach(x=>al.push({lv:'o',dept:'采购',t:`${x['名称']} 剩余库存仅 ${pct(ratio(x))}`,s:`剩 ${num(x['剩余库存'])} / ${num(x['目前库存'])} ${arr(x['单位'])} · ${arr(x['供应商'])}`,go:'purchase'}));
  m.pendShip.forEach(f=>al.push({lv:'i',dept:'仓储',t:`发货单 ${f['发货单号']} 待发货 ${num(f['发货数量'])} 台`,s:arr(f['产品名称']),go:'warehouse'}));
  m.unrepaired.forEach(f=>al.push({lv:'o',dept:'生产',t:`变频器 ${f['S\\N']} 返厂未修复`,s:arr(f['返厂故障原因']),go:'production'}));
  m.alerts=al;m.urgent=al.filter(a=>a.lv==='r').length;
  return m;
}

const tbl=n=>(state.data&&state.data.tables[n])||null;
const tUrl=n=>{const t=tbl(n);return t?t.url:null};
const recUrl=(n,rid)=>{const u=tUrl(n);return u?(rid?u+'&record='+encodeURIComponent(rid):u):null};
const tnById=id=>{const d=state.data;if(!d||!id)return null;for(const [n,t] of Object.entries(d.tables))if(t.table_id===id)return n;return null};

const ISOD=/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\+08:00$/;
function fvText(name,v){
  if(Array.isArray(v))return v.join('、');
  if(typeof v==='number')return (/率|进度/.test(name)&&v<=1)?pct(v):v.toLocaleString('zh-CN');
  if(typeof v==='boolean')return v?'是':'否';
  if(typeof v==='string'&&ISOD.test(v))return v.endsWith('T00:00:00+08:00')?v.slice(0,10):v.slice(0,16).replace('T',' ');
  return String(v);
}
const fv=(n,v)=>isEmpty(v)?'<span class="mut">—</span>':esc(fvText(n,v));
const dv=(n,v)=>{if(isEmpty(v))return '<span class="mut">空</span>';const s=fvText(n,v);return esc(s.length>60?s.slice(0,60)+'…':s)};
const bjf=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const fmtTF=iso=>iso?bjf.format(new Date(iso)).replace(/\//g,'-'):'—';

function recLabel(r){for(const k of ID_F){if(!isEmpty(r[k]))return plain(r[k])}for(const [k,v] of Object.entries(r))if(k!=='record_id'&&typeof v==='string'&&v)return v;return r.record_id}
const LOC={'生产完成汇总表':{p:'production'},'生产工单':{p:'production'},'生产记录':{p:'production',tab:'records'},'变频器使用情况记录':{p:'production',tab:'after'},'变频器故障记录':{p:'production',tab:'after'},'领料记录':{p:'warehouse'},'发货清单':{p:'warehouse'},'产品物料基础资料':{p:'warehouse'}};
const refs=(r,tn,ids)=>{const a=ids?ids(r):(tn&&r&&r.record_id?[[tn,r.record_id]]:[]);return a.filter(x=>x&&x[0]&&x[1])};
const rowAttr=(r,tn,ids,cls)=>{const a=refs(r,tn,ids);return a.length?` class="rowlink ${cls||''}" tabindex="0" data-rs="${esc(';'+a.map(x=>x[0]+'|'+x[1]).join(';')+';')}" title="点击查看该记录的全部字段"`:` class="${cls||''}"`};

function fullTable(tn,recs){
  const t=tbl(tn);if(!t)return '<div class="empty">无数据</div>';
  return `<div class="fnote">共 ${t.fields.length} 个字段 · ${recs.length} 条记录 · 可左右滚动查看全部字段</div><div class="tw"><table class="full"><thead><tr>${t.fields.map(f=>`<th>${esc(f.name)}</th>`).join('')}</tr></thead><tbody>${recs.map(r=>`<tr${rowAttr(r,tn,null,'')}>${t.fields.map(f=>`<td title="${esc(plain(r[f.name]))}">${fv(f.name,r[f.name])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${t.fields.length}" class="empty">暂无记录</td></tr>`}</tbody></table></div>`;

function diffHTML(c){
  const d=c.diff;
  if(!d){const f=c.fields||[];return f.length?`<div class="chips" style="margin-top:6px">${f.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}<span class="hint">（旧日志未保存具体数值）</span></div>`:''}
  const ks=Object.keys(d);if(!ks.length)return '';
  const row=k=>{const o=d[k]||{},nm=esc(k);
    if(c.type==='added')return `<div class="k">${nm}</div><div><span class="n">${dv(k,o.to)}</span></div>`;
    if(c.type==='removed')return `<div class="k">${nm}</div><div><span class="o">${dv(k,o.from)}</span></div>`;
    return `<div class="k">${nm}</div><div><span class="o">${dv(k,o.from)}</span><span class="ar">→</span><span class="n">${dv(k,o.to)}</span></div>`};
  return `<div class="diff">${ks.slice(0,12).map(row).join('')}${ks.length>12?`<div class="k">…</div><div class="mut">另有 ${ks.length-12} 个字段</div>`:''}</div>`;
}
const CHG_LAB={added:'新增',updated:'更新',removed:'删除',table_added:'新增数据表',table_removed:'删除数据表',initial_sync:'首次同步'};
function chgItem(c){
  const tn=tnById(c.table_id)||c.table||'',t=tbl(tn);
  const cls=c.type==='added'?'g':c.type==='removed'?'r':c.type==='updated'?'b':'';
  const time=`<time datetime="${esc(c.ts)}">${fmtTF(c.ts)}（北京时间）</time>`;
  const pl=`<span class="pill ${cls}">${CHG_LAB[c.type]||esc(c.type)}</span>`;
  if(c.type==='initial_sync'){const cn=c.counts||{};const tot=Object.values(cn).reduce((a,b)=>a+b,0);
    return `<div class="chg"><div class="hd">${time}${pl}<span class="lb">首次同步 ${tot} 条记录</span></div><div class="chips" style="margin-top:6px">${Object.entries(cn).map(([n,k])=>`<span class="chip">${tUrl(n)?ext(tUrl(n),esc(n)+' ↗','lnk'):esc(n)} ${k} 条</span>`).join('')}</div></div>`}
  const tname=`<span class="tn">${t?ext(t.url,esc(tn)+' ↗','lnk','在飞书中打开该数据表'):esc(tn)}</span>`;
  const isRec=c.type==='added'||c.type==='updated'||c.type==='removed';
  let acts='';
  if(c.type==='added'||c.type==='updated'){
    const ex=!!(t&&t.records.some(r=>r.record_id===c.record_id));
    acts=ex?`<button class="btn sm go" data-loc="${esc(tn+'|'+c.record_id)}">在工作台定位</button>${ext(recUrl(tn,c.record_id),'在飞书中打开 ↗','btn sm fs')}`
      :`<button class="btn sm go" disabled title="该记录当前已不存在">在工作台定位</button>${ext(tUrl(tn),'在飞书中打开数据表 ↗','btn sm fs')}`;
  }else if(c.type==='removed'||c.type==='table_added'){
    acts=(t?`<button class="btn sm go" data-loct="${esc(tn)}">在工作台查看该表</button>`:'')+ext(tUrl(tn),'在飞书中打开数据表 ↗','btn sm fs');
  }
  const cnt=c.type==='table_added'&&c.count!=null?`<span class="mut">${c.count} 条记录</span>`:'';
  return `<div class="chg"><div class="hd">${time}${pl}${tname}${isRec?`<span class="lb">${esc((t&&t.records.find(r=>r.record_id===c.record_id)&&recLabel(t.records.find(r=>r.record_id===c.record_id)))||c.label||'')}</span>`:''}${cnt}<span class="act">${acts}</span></div>${isRec?diffHTML(c):''}</div>`;
}
function drawerSec(tn,rid){
  const t=tbl(tn),rec=t&&t.records.find(r=>r.record_id===rid);

  const hist=state.changes.filter(c=>c.record_id===rid).sort((a,b)=>b.seq-a.seq).slice(0,5);
  return `<div class="dsec"><small class="mut">${esc(tn)}</small><h3 style="margin:0;font-size:18px">${esc(recLabel(rec))}</h3>
  <div class="acts"><button class="btn sm go" data-loc="${esc(tn+'|'+rid)}">在工作台定位</button>${ext(recUrl(tn,rid),'在飞书中打开 ↗','btn sm fs')}</div>

function renderDrawer(focus){
  const d=$('#drawer'),bg=$('#dbg');if(!d)return;
  if(!state.drawer){d.classList.remove('on');bg.classList.remove('on');d.setAttribute('aria-hidden','true');return}
  const old=d.querySelector('.db'),top=old?old.scrollTop:0;
  d.innerHTML=`<div class="dh"><div><h3>记录详情</h3><small>字段按飞书表格顺序全部列出 · 按 Esc 或点击遮罩关闭</small></div><button class="x" id="dx" aria-label="关闭">×</button></div><div class="db">${state.drawer.map(x=>drawerSec(x[0],x[1])).join('')}</div>`;
  d.classList.add('on');bg.classList.add('on');d.setAttribute('aria-hidden','false');
  d.querySelector('.db').scrollTop=top;
  $('#dx').onclick=()=>closeDrawer();
  d.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{const i=b.dataset.loc.indexOf('|');locate(b.dataset.loc.slice(0,i),b.dataset.loc.slice(i+1))});

}

const moneyFmt=value=>'¥'+Number(value||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function taskFlow(m){
  const task=state.task,step=task&&task.steps||[];
  const nodes=[
    ['总助','CEO 总助 Agent','理解目标、拆解依赖并分派子任务','等待任务'],
    ['产','生产 Agent','读取标准用量并生成物料需求',m.W.length+' 张工单'],
    ['仓','仓储 Agent','核对库存、预留、在途和安全库存',m.short.length+' 项欠领'],
    ['采','采购 Agent','根据缺口生成补货和报价建议',(m.low.length+m.short.length)+' 项待询价'],
    ['财','财务 Agent','汇总库存耗用、采购、税费和运费','等待成本计算'],
    ['批','CEO 人工审批','确认结果后才允许进入写回阶段','人工决策点']
  ];
  const started=state.taskStage>=0,approved=task&&task.approval&&task.approval.status==='approved_local_only';
  return `<div class="card flow-card"><div class="flow-head"><b>任务执行链</b><span>${!started?'尚未启动':approved?'本地审批完成':state.taskStage===nodes.length-1?'已到达人工审批':'正在执行任务'}</span></div><div class="agent-flow">${nodes.map((n,i)=>{
    let cls='',status='待执行';
    if(approved||started&&i<state.taskStage){cls='done';status='已完成'}
    else if(started&&i===state.taskStage){cls=i===nodes.length-1?'waiting':'running';status=i===nodes.length-1?'等待审批':'执行中'}
    const result=step[i]&&step[i].result||n[3];
    return `<div class="agent-node ${cls}" data-task-node="${i}"><div class="node-top"><span class="node-icon">${n[0]}</span><span class="node-status">${status}</span></div><b>${n[1]}</b><p>${n[2]}</p><small>${esc(result)}</small></div>`
  }).join('')}</div><p class="flow-note"><b>当前执行方式：</b>后端规则引擎真实读取飞书数据；缺失字段使用明确标记的模拟值。尚未调用大模型，也不会写入飞书。</p></div>`
}

  return head('CEO 总助 Agent','读取飞书真实数据，编排生产、仓储、采购和财务规则任务')+
  (m?`${H('今日简报',src('综合各部门表格'))}<div class="card panel">${alertList(m.alerts,6)}</div>`:'')+
  `${H('任务编排与执行','<div class="source-key"><span class="source-pill real">飞书真实数据</span><span class="source-pill mock">缺失字段模拟</span></div>')}<section class="card hero"><h2>向公司下达任务</h2><p>输入产品和数量，系统将生成真实物料需求、模拟补充数据、采购建议和成本测算。</p><div class="task-compose"><textarea id="req" aria-label="任务内容">${esc(state.taskRequest)}</textarea><button class="btn primary" id="runTask" ${state.taskBusy?'disabled':''}>${state.taskBusy?'执行中…':'执行任务'}</button></div>${state.taskError?`<div class="task-error">${esc(state.taskError)}</div>`:''}</section>
  ${taskFlow(m)}${taskResult(state.task)}<div class="grid2" style="margin-top:14px"><div class="card panel"><b>当前核心能力</b>${[['任务运行时','已实现','write','保存任务、步骤、来源、结果和审批状态。'],['规则型部门 Agent','已实现','write','按顺序完成生产、仓储、采购和财务计算。'],['自然语言大模型','尚未接入','approval','当前用规则提取产品编码和数量，后续可替换为模型解析。']].map(p=>`<div class="perm"><div><b style="font-size:14px">${p[0]}</b><p>${p[3]}</p></div><span class="k ${p[2]}">${p[1]}</span></div>`).join('')}</div>
  <aside class="card panel"><b>权限边界</b>${[['飞书业务数据','只读','read','读取生产、库存、供应商等真实字段。'],['模拟补充数据','本地生成','write','只用于演示缺失字段，不写回飞书。'],['任务审批记录','本地保存','write','保存审批状态和时间。'],['飞书正式写入','禁止','deny','当前没有创建、更新或删除飞书记录的代码。']].map(p=>`<div class="perm"><div><b style="font-size:14px">${p[0]}</b><p>${p[3]}</p></div><span class="k ${p[2]}">${p[1]}</span></div>`).join('')}</aside></div>`}
function finance(){
  return head('财务 Agent','把库存耗用和新增采购统一核算，输出预算影响和审批意见',demoBadge)+
  `<div class="demo-box"><b>示例数据</b>：飞书 8 张表里还没有成本 / 单价字段，本页数字是演示。建议在「产品物料基础资料」增加「单价」列，即可由库存 × 单价算出真实占用资金。</div>
  <div class="grid2"><div class="card panel"><div class="formula">项目预计总成本 = 现有库存耗用 ¥255,856 + 缺料采购 ¥129,385 + 物流 ¥3,200 + 风险准备金 ¥7,705 = <b>¥396,146</b></div>
  <div class="money"><span>现有库存耗用成本</span><b>¥255,856</b></div><div class="money"><span>缺料采购预算</span><b>¥129,385</b></div><div class="money"><span>预计物流费用</span><b>¥3,200</b></div><div class="money"><span>风险准备金</span><b>¥7,705</b></div><div class="money total"><span>预计总成本</span><b>¥396,146</b></div>
  <div class="formula">建议批准，但设置两个条件：① 关键物料到货不晚于目标领料日前 2 天；② 单价超过阈值时重新提交审批。</div>
  <button class="btn primary" data-action="approve">批准采购预算</button> <button class="btn" data-action="return">退回采购重新比价</button></div>
  <aside class="card panel"><b>财务查看与写入范围</b>${[['生产/库存/采购汇总','只读','read','读取数量与来源单据，不改业务事实。'],['成本分析与预算意见','可写','write','保存成本版本、估算公式和审批意见。'],['真实付款','首期禁止','deny','不连接银行，不允许 Agent 自动付款。'],['预算超限','强制审批','approval','超过预算或价格阈值须重新提交 CEO。']].map(p=>`<div class="perm"><div><b style="font-size:14px">${p[0]}</b><p>${p[3]}</p></div><span class="k ${p[2]}">${p[1]}</span></div>`).join('')}</aside></div>`}
function dtRows(){const t=tbl(state.dt);if(!t)return [];const q=(state.dtq||'').trim().toLowerCase();if(!q)return t.records;return t.records.filter(r=>t.fields.some(f=>plain(r[f.name]).toLowerCase().includes(q)))}
function dtBody(){const rs=dtRows();return fullTable(state.dt,rs)}
function logs(){
  const all=state.changes.slice().sort((a,b)=>b.seq-a.seq);
  const tnOf=c=>tnById(c.table_id)||c.table||'';
  const names=[...new Set([...(state.data?Object.keys(state.data.tables):[]),...all.map(tnOf).filter(Boolean)])];
  const f=state.lf;
  const list=all.filter(c=>(!f.tn||tnOf(c)===f.tn||(c.type==='initial_sync'&&c.counts&&f.tn in c.counts))&&(!f.type||c.type===f.type));
  const shown=list.slice(0,f.n);
  const sel=(id,opts,val)=>`<select id="${id}">${opts.map(o=>`<option value="${esc(o[0])}"${o[0]===val?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  return head('协作日志与结果追溯','飞书表格的每次变更都会自动记录；可一键定位到工作台，或直接在飞书中打开对应记录')+
  `${H('飞书表格变更记录（最新在前）',src('变更日志'))}<div class="card panel"><div class="fbar"><label>数据表${sel('lfT',[['','全部数据表'],...names.map(n=>[n,n])],f.tn)}</label><label>类型${sel('lfY',[['','全部类型'],['added','新增'],['updated','更新'],['removed','删除']],f.type)}</label><span class="hint">共 ${list.length} 条 · 时间均为北京时间（UTC+8）</span></div>${shown.map(chgItem).join('')||'<div class="empty">没有符合条件的变更</div>'}${list.length>shown.length?`<div style="text-align:center;padding-top:10px"><button class="btn" id="lfMore">显示更多（还有 ${list.length-shown.length} 条）</button></div>`:''}</div>
  ${H('Agent 协作链路示例',demoSrc())}<div class="card panel">${table([{h:'序号',f:r=>r[0]},{h:'Agent',cls:'nw',f:r=>r[1]},{h:'动作',cls:'tx',f:r=>r[2]},{h:'读取来源',cls:'sec',f:r=>r[3]},{h:'状态',f:r=>r[4]}],[['01','CEO 总助','解析需求','CEO 指令','完成'],['02','生产 Agent','展开物料需求','产品物料基础资料','完成'],['03','仓储 Agent','核对库存','领料记录、库存','完成'],['04','采购 Agent','供应商比价','报价记录','完成'],['05','财务 Agent','汇总总成本','库存成本、采购方案','完成'],['06','CEO','审批采购预算','全部部门结果','等待审批']].map(r=>r))}</div>`}

/* ---------- 渲染 ---------- */
function body(){
  const p=state.page;
  if(p==='finance')return finance();
  if(p==='logs'&&true)return logs();
  if(!state.data){return head({overview:'总览',assistant:'CEO 总助',production:'生产',warehouse:'仓储',purchase:'采购',tables:'数据表'}[p]||'',state.err||'正在读取飞书数据…','<span class="badge demo">'+(state.fetchFail?'未连接':'读取中')+'</span>')+`<div class="card empty">${esc(state.err||'正在读取飞书多维表格数据…')}</div>`}
  const m=model();
  if(p==='assistant')return assistant(m);
  return pages[p](m);
}
function paint(){
  const y=scrollY;
  const app=$('#app');app.innerHTML=body();
  wire();renderFoot();renderDrawer();
  scrollTo(0,y);
}
function renderFoot(){
  const s=state.status,f=$('#foot');
  document.querySelectorAll('.top .badge:not(.demo)').forEach(b=>b.outerHTML=liveBadge());
  if(state.fetchFail||!s){f.innerHTML=`<span class="dot bad"></span><b>服务连接中断</b><div class="l2">无法访问数据服务，页面显示最后一次读取的数据；将自动重试。</div>`;return}
  const stale=s.last_sync_at&&(Date.now()-new Date(s.last_sync_at))>5*60000;
  const cls=!s.ok?'warn':stale?'warn':'';
  f.innerHTML=`<span class="dot ${cls}"></span><b>${!s.ok?'同步异常，显示上次数据':stale?'同步可能延迟':'飞书多维表格已连接'}</b><div class="l2">最后同步 ${fmtT(s.last_sync_at)}（北京）<br>${s.mode==='push'?'实时推送 + 轮询兜底':'每 60 秒轮询'}${state.live?' · 页面实时通道在线':' · 页面每 30 秒自动检查'}</div>`;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function animateTask(){
  if(state.taskTimer)clearInterval(state.taskTimer);
  state.taskStage=0;paint();
  state.taskTimer=setInterval(()=>{
    if(state.taskStage>=5){clearInterval(state.taskTimer);state.taskTimer=null;return}
    state.taskStage+=1;paint();
    if(state.taskStage===5){clearInterval(state.taskTimer);state.taskTimer=null;toast('任务计算完成，等待人工审批')}
  },900)
}
async function runTask(){
  const req=$('#req'),request=(req&&req.value||state.taskRequest).trim();
  if(!request){toast('请先输入任务');return}
  state.taskRequest=request;state.taskBusy=true;state.taskError=null;paint();
  try{const b=await postJSON('/api/tasks/run',{request});state.task=b.task;state.taskBusy=false;animateTask()}
  catch(e){state.taskBusy=false;state.taskError=e.status===403?'任务执行目前仅限本机打开的页面':e.message;paint()}
}
async function approveTask(){
  if(!state.task)return;
  try{const b=await postJSON('/api/tasks/'+encodeURIComponent(state.task.id)+'/approve',{note:'CEO 在工作台本地批准'});state.task=b.task;state.taskStage=5;paint();toast('已完成本地审批，没有写入飞书')}
  catch(e){state.taskError=e.message;paint()}
}
function wireRows(){
  document.querySelectorAll('#app [data-rs]').forEach(e=>{
    e.onclick=ev=>{if(ev.target.closest('a,button'))return;openDrawer(parseRs(e.dataset.rs))};
    e.onkeydown=ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target===e){ev.preventDefault();openDrawer(parseRs(e.dataset.rs))}};
  });
}
function wireX(){
  wireRows();
  document.querySelectorAll('[data-full]').forEach(b=>b.onclick=()=>{const n=b.dataset.full;state.full[n]=!state.full[n];paint()});
  document.querySelectorAll('#app [data-loc]').forEach(b=>b.onclick=()=>{const i=b.dataset.loc.indexOf('|');locate(b.dataset.loc.slice(0,i),b.dataset.loc.slice(i+1))});
  document.querySelectorAll('#app [data-loct]').forEach(b=>b.onclick=()=>{state.dt=b.dataset.loct;state.dtq='';goPage('tables')});
  document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{state.dt=b.dataset.dt;state.dtq='';paint()});
  const q=$('#dtQ');if(q)q.oninput=()=>{state.dtq=q.value;$('#dtBody').innerHTML=dtBody();$('#dtCnt').textContent=state.dtq?`匹配 ${dtRows().length} / ${tbl(state.dt).count} 条`:'';wireRows()};
  const rf=$('#dtRefresh');if(rf)rf.onclick=async()=>{rf.disabled=true;try{const r=await fetch('/api/base/refresh',{method:'POST'});toast(r.status===403?'仅限在本机打开的页面手动刷新；页面会自动同步':r.ok?'已从飞书重新读取（只读）':'刷新失败，稍后会自动重试')}catch{toast('刷新失败')}rf.disabled=false;loadData()};
  const refocus=id=>{const e=$('#'+id);if(e)e.focus()};
  const lt=$('#lfT');if(lt)lt.onchange=()=>{state.lf.tn=lt.value;state.lf.n=40;paint();refocus('lfT')};
  const ly=$('#lfY');if(ly)ly.onchange=()=>{state.lf.type=ly.value;state.lf.n=40;paint();refocus('lfY')};
  const lm=$('#lfMore');if(lm)lm.onclick=()=>{state.lf.n+=40;paint()};
}
function wire(){wireX();
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{location.hash='#/'+e.dataset.go});
  document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{state.tab=e.dataset.tab;paint()});
  const req=$('#req');if(req)req.oninput=()=>{state.taskRequest=req.value};
  const run=$('#runTask');if(run)run.onclick=runTask;
  const approve=$('#approveTask');if(approve)approve.onclick=approveTask;
  document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>toast(e.dataset.action==='approve'?'已模拟批准，不会写入真实飞书':'已模拟退回采购重新比价'));
}
function route(){
  const h=(location.hash||'').replace(/^#\/?/,'').split(/[/?]/)[0];
  const p=PAGES.includes(h)?h:'overview';
  const changed=p!==state.page;state.page=p;
  document.querySelectorAll('.nav').forEach(n=>{const a=n.dataset.p===p;n.classList.toggle('active',a);n.setAttribute('aria-current',a?'page':'false')});
  document.title='AI Company OS · '+({overview:'总览',assistant:'CEO 总助',production:'生产',warehouse:'仓储',purchase:'采购',finance:'财务',tables:'数据表',logs:'协作日志'}[p]);
  paint();if(changed)scrollTo(0,0);applyHL();
}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{location.hash='#/'+n.dataset.p});
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
$('#dbg').onclick=()=>closeDrawer();
route();loadData();loadLatestTask();startLive();
</script></body></html>
